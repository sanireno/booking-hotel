[package]
name = "booking-hotel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
argon2 = { version = "0.5.3", features = ["std"] }
email_address = "0.2.9"
jsonwebtoken = { version = "9.3.1", default-features = false }
uuid = { version = "1.26.1", features = ["v4","serde"] }
chrono = {version = "0.4.45",features = ["serde"]}
rust_decimal = "1.43.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "rust_decimal", "migrate"] }
serde = { version = "1.0.229", features = ["derive"] }
dotenvy = "0.15.7"
thiserror = "2.0.20"
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"
serde_json = "1.0.151"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
